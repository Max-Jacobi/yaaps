[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yaaps"
version = "0.0.1"
description = "Routines to post-process and plot output from GRAthena++"
authors = [
    { name = "Maximilian Jacobi", email = "maximilian.jacobi@uni-jena.de" }
]
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["yaaps*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["yaaps/athena_read.py"]  # vendored Athena++ code, keep diffable upstream

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "NPY",      # numpy-specific rules
    "UP",       # pyupgrade
]
ignore = [
    "E741",     # ambiguous variable names — physics code legitimately uses l, I
]
